<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI-assisted product development workshop for PM, BA and Product Design teams working with Git, worktrees, AI coding agents, Next.js, Storybook and mock data." />
  <meta name="theme-color" content="#0f766e" />
  <title>AI Product Workshop</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="./styles.css?v=20260924m" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="diagramModal" class="diagram-modal" aria-hidden="true">
    <div class="diagram-modal-backdrop" data-modal-close></div>
    <div class="diagram-modal-panel" role="dialog" aria-modal="true" aria-label="Diagram viewer">
      <div class="diagram-modal-toolbar">
        <strong id="diagramModalTitle" class="diagram-modal-title"></strong>
        <div class="diagram-modal-tools">
          <button type="button" id="diagramZoomOut" aria-label="Zoom out"></button>
          <span id="diagramZoomLabel" class="diagram-zoom-label">100%</span>
          <button type="button" id="diagramZoomIn" aria-label="Zoom in"></button>
          <button type="button" id="diagramZoomReset" aria-label="Reset zoom"></button>
          <button type="button" id="diagramModalClose" aria-label="Close" data-modal-close></button>
        </div>
      </div>
      <div class="diagram-modal-body" id="diagramModalBody">
        <div class="diagram-modal-svg" id="diagramModalContent"></div>
      </div>
    </div>
  </div>
  <script src="./content.js?v=20260924m"></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.startOnLoad = false;
    window.mermaid = mermaid;
    window.dispatchEvent(new Event('mermaid-ready'));
  </script>
  <script src="./speech-player.js?v=20260924n" defer></script>
  <script src="./app.js?v=20260924n" defer></script>
</body>
</html>
